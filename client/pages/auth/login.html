<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101311">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23c4f05b'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='36' font-weight='900' font-style='italic' text-anchor='middle' fill='%23111511'%3ES%3C/text%3E%3C/svg%3E">
    <title>התחברות | SPORTIME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/auth.css">
    <script type="module" src="../../js/features/auth/login.page.js"></script>
</head>
<body class="inner-page">
    <header id="site-header" class="site-header inner-header">
        <div class="page-hero">
            <p class="page-kicker">הכניסה שלך לאימון הבא</p>
            <h1 id="auth-title" class="page-title">התחברות<span class="page-title-accent">.</span></h1>
            <p class="page-subtitle">התחברות ל־SPORTIME</p>
        </div>
    </header>
    <main class="auth-main page-container">
        <section class="auth-card" aria-labelledby="auth-title">
            <p class="auth-eyebrow">ברוכים הבאים ל־SPORTIME</p>
            <p class="auth-intro">מתחברים וממשיכים לזוז.</p>
            <form id="login-form">
                <div class="auth-field">
                    <label for="email">אימייל</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="auth-field">
                    <label for="password">סיסמה</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary auth-submit" type="submit">התחברות</button>
            </form>
            <p class="auth-switch">אין לך חשבון? <a href="/pages/auth/register.html">להרשמה</a></p>
        </section>
    </main>
</body>
</html>
